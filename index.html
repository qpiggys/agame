<!DOCTYPE html>
<html>
  <head>
    <title>A Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>

  <body class="d-flex justify-content-center align-items-center vh-100">

    <div class="container" style="max-width: 300px;">
      
      <!-- Display -->
      <input
        id="display"
        type="text"
        class="form-control mb-3 text-end"
        readonly
      >

      <!-- Buttons -->
      <div class="row g-2">
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('7')">7</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('8')">8</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('9')">9</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="add('/')">÷</button></div>

        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('4')">4</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('5')">5</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('6')">6</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="add('*')">×</button></div>

        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('1')">1</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('2')">2</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('3')">3</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="add('-')">−</button></div>

        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('0')">0</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="add('.')">.</button></div>
        <div class="col-3"><button class="btn btn-danger w-100" onclick="clearDisplay()">C</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="add('+')">+</button></div>

        <div class="col-12">
          <button class="btn btn-success w-100" onclick="calculate()">=</button>
        </div>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");

      function add(value) {
        display.value += value;
      }

      function clearDisplay() {
        display.value = "";
      }

      function calculate() {
        try {
          const result = eval(display.value);

          // Convert result to hexadecimal
          display.value = Number(result).toString(16);
        } catch {
          display.value = "Error";
        }
      }
    </script>

  </body>
</html>
