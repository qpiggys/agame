<!DOCTYPE html>
<html>
  <head>
    <title>A Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>

  <body class="d-flex justify-content-center align-items-center vh-100">

    <div class="container text-center" style="max-width: 300px;">

      <div style="font-family: 'Comic Sans MS', 'Comic Sans', cursive; color: black;" class="mb-3">
        <div style="font-size: 1.6rem; font-weight: bold;">
          A Classic Calculator
        </div>
        <div style="font-size: 0.85rem;">
          except you enter in decimal and it will only give you hex
        </div>
      </div>

      <div class="form-control mb-3 text-end">
        <div id="previous" class="text-muted" style="font-size: 0.8rem;"></div>
        <div id="display" style="font-size: 1.2rem;"></div>
      </div>

      <div class="row g-2">
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('7')">7</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('8')">8</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('9')">9</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="operator('/')">÷</button></div>

        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('4')">4</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('5')">5</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('6')">6</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="operator('*')">×</button></div>

        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('1')">1</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('2')">2</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('3')">3</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="operator('-')">−</button></div>

        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('.')">.</button></div>
        <div class="col-3"><button class="btn btn-secondary w-100" onclick="input('0')">0</button></div>
        <div class="col-3"><button class="btn btn-danger w-100" onclick="clearAll()">C</button></div>
        <div class="col-3"><button class="btn btn-warning w-100" onclick="operator('+')">+</button></div>

        <div class="col-12">
          <button class="btn btn-success w-100" onclick="calculate()">=</button>
        </div>
      </div>
    </div>

    <script>
      const display = document.getElementById("display");
      const previous = document.getElementById("previous");

      let justCalculated = false;
      let ans = null;

      function input(value) {
        if (justCalculated) {
          display.textContent = "";
          justCalculated = false;
        }
        display.textContent += value;
      }

      function operator(op) {
        if (justCalculated && ans !== null) {
          display.textContent = ans + op;
          justCalculated = false;
        } else {
          display.textContent += op;
        }
      }

      function calculate() {
        try {
          const expression = display.textContent;
          const result = eval(expression);

          ans = result;
          const hex = Number(result).toString(16);
          previous.textContent = "ANS = " + hex;
          display.textContent = hex;
          justCalculated = true;
        } catch {
          display.textContent = "Error";
        }
      }

      function clearAll() {
        display.textContent = "";
        previous.textContent = "";
        ans = null;
        justCalculated = false;
      }
    </script>

  </body>
</html>
